  @media (prefers-color-scheme:dark){
    :root{ --bg:#0f150f; --panel:#18201a; --ink:#e8efe6; --muted:#9fb0a0; --line:#28332a;
      --accent:#5cbe63; --accent2:#8fd694; --gold:#d9b968; --chip:#212c22;
      --eagle:#2bd79a; --birdie:#5fce93; --par:#3a4a3c; --bogey:#c98a63; --double:#e0795a;
      --scrim:rgba(15,21,15,.86); }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.45}
  body::before{content:"";position:fixed;inset:0;z-index:-2;
    background:var(--bgimg) center center/cover no-repeat;}
  body::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--scrim);}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px 80px}
  header.top{position:relative;color:#fff;padding:30px 16px 26px;text-align:center;
    box-shadow:var(--shadow);
    background:linear-gradient(180deg,rgba(20,50,22,.62),rgba(27,94,32,.78)),var(--bgimg) center 32%/cover no-repeat;
    text-shadow:0 1px 8px rgba(0,20,0,.45)}
  header.top h1{margin:0;font-size:clamp(20px,4.5vw,30px);letter-spacing:.2px}
  header.top p{margin:6px 0 0;opacity:.9;font-size:14px}
  nav.tabs{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;gap:2px;overflow-x:auto;padding:6px 10px;box-shadow:var(--shadow)}
  nav.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);
    font-size:14px;font-weight:600;padding:9px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}
  nav.tabs button.active{background:var(--accent);color:#fff}
  section{margin-top:22px}
  h2.sec{font-size:15px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:0 0 12px;font-weight:700}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:16px;box-shadow:var(--shadow)}
  .hide{display:none}
  /* champion */
  .champ{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#faf6e9,#fff);
    border:1px solid var(--gold);border-radius:16px;padding:16px 18px;margin-bottom:16px}
  @media(prefers-color-scheme:dark){.champ{background:linear-gradient(135deg,#241f10,#18201a)}}
  .champ .medal{font-size:40px}
  .champ .who{font-size:22px;font-weight:800}
  .champ .sub{color:var(--muted);font-size:13px}
  /* leaderboard */
  table.lb{width:100%;border-collapse:collapse}
  table.lb th,table.lb td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
  table.lb th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  table.lb td.num,table.lb th.num{text-align:right;font-variant-numeric:tabular-nums}
  .rank{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;
    border-radius:50%;background:var(--chip);font-weight:700;font-size:12px}
  .rank.r1{background:var(--gold);color:#3a2e07}
  .bar{height:8px;border-radius:6px;background:var(--accent);opacity:.85}
  .pname{font-weight:700;display:inline-flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  /* chips / selectors */
  .selrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .selrow button{border:1px solid var(--line);background:var(--panel);color:var(--ink);
    font-weight:600;font-size:13px;padding:8px 13px;border-radius:20px;cursor:pointer}
  .selrow button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  /* cards grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .stat .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .stat .val{font-size:22px;font-weight:800;margin-top:4px}
  .stat .who2{font-size:13px;color:var(--muted);margin-top:2px}
  /* match card */
  .mcard{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--panel)}
  .mcard .lab{font-size:12px;color:var(--muted);letter-spacing:.4px}
  .teamrow{display:flex;align-items:center;gap:10px;margin-top:8px}
  .teamrow .nm{flex:1;font-weight:700;font-size:14px}
  .teamrow .sc{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px}
  .teamrow.win .sc{color:var(--accent)}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;
    background:var(--accent);color:#fff;margin-top:8px}
  .badge.tie{background:var(--muted)}
  /* scorecard grid */
  .toggle{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:12px}
  .toggle button{border:0;background:var(--panel);color:var(--muted);font-weight:600;font-size:12px;
    padding:7px 14px;cursor:pointer}
  .toggle button.active{background:var(--accent);color:#fff}
  .scwrap{overflow-x:auto}
  table.sc{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
  table.sc th,table.sc td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line);
    font-variant-numeric:tabular-nums}
  table.sc th{color:var(--muted);font-size:11px;font-weight:700}
  table.sc td.pl{text-align:left;font-weight:700;white-space:nowrap}
  table.sc td.tot{font-weight:800}
  table.sc tr.parrow th{font-weight:700;color:var(--ink);font-size:11px}
  .cell{display:inline-flex;min-width:22px;justify-content:center;padding:2px 4px;border-radius:6px}
  .c-eagle{background:var(--eagle);color:#fff}
  .c-birdie{background:var(--birdie);color:#08301f}
  .c-par{background:var(--par);color:var(--ink)}
  .c-bogey{background:var(--bogey);color:#3a1a08}
  .c-double{background:var(--double);color:#fff}
  .bonusdot{color:var(--gold);font-weight:900}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
  /* player profile */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
  .catbars{display:grid;gap:8px}
  .catbar{display:flex;align-items:center;gap:8px;font-size:13px}
  .catbar .k{width:64px;color:var(--muted)}
  .catbar .track{flex:1;background:var(--chip);border-radius:6px;height:16px;position:relative;overflow:hidden}
  .catbar .fill{display:block;height:100%;border-radius:6px;min-width:2px}
  .catbar .n{width:26px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .ninebars{display:flex;gap:6px;align-items:flex-end;height:90px;margin-top:6px}
  .ninebars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
  .ninebars .b .bar2{width:100%;background:var(--accent);border-radius:5px 5px 0 0;min-height:3px}
  .ninebars .b .cap{font-size:10px;color:var(--muted)}
  .ninebars .b .v{font-size:11px;font-weight:700}
  .note{font-size:12px;color:var(--muted);margin-top:10px}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
</style>

const PC = {A:'#2563eb',B:'#d97706',C:'#0e9f6e',D:'#db2777',E:'#7c3aed'}; // player colors
const CODES = DATA.players.map(p=>p.code);
const NAME = {}; DATA.players.forEach(p=>NAME[p.code]=p.name);
const HC = {}; DATA.players.forEach(p=>HC[p.code]=p.hc);
const $ = (s,el=document)=>el.querySelector(s);
const el=(t,c,html)=>{const e=document.createElement(t);if(c)e.className=c;if(html!=null)e.innerHTML=html;return e;};

// ---------- TABS ----------
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  ['standings','teams','matches','players','records'].forEach(id=>$('#'+id).classList.add('hide'));
  $('#'+b.dataset.tab).classList.remove('hide');
  window.scrollTo({top:0,behavior:'smooth'});
});

// ---------- STANDINGS ----------
function renderStandings(){
  const s=$('#standings'); s.innerHTML='';
  const order=[...CODES].sort((a,b)=>DATA.overall[b]-DATA.overall[a]);
  const champ=order[0], mx=DATA.overall[champ];
  s.appendChild(el('div','champ',
    `<div class="medal">🏆</div><div><div class="sub">Weekend Stableford Champion</div>
     <div class="who" style="color:${PC[champ]}">${NAME[champ]}</div>
     <div class="sub">${mx} points · won by ${mx-DATA.overall[order[1]]} over ${NAME[order[1]]}</div></div>`));
  const p=el('div','panel');
  p.appendChild(el('h2','sec','Individual Stableford — full weekend'));
  let rows=order.map((c,i)=>{
    const w=Math.round(DATA.overall[c]/mx*100);
    return `<tr>
      <td><span class="rank ${i==0?'r1':''}">${i+1}</span></td>
      <td><span class="pname"><span class="dot" style="background:${PC[c]}"></span>${NAME[c]}</span></td>
      <td class="num">${HC[c]}</td>
      <td class="num">${DATA.fri[c]}</td>
      <td class="num">${DATA.sat[c]}</td>
      <td class="num"><b>${DATA.overall[c]}</b></td>
      <td style="width:34%"><div class="bar" style="width:${w}%;background:${PC[c]}"></div></td>
    </tr>`;}).join('');
  p.appendChild(el('table','lb',
    `<thead><tr><th></th><th>Player</th><th class="num">HC</th><th class="num">Fri</th>
     <th class="num">Sat</th><th class="num">Total</th><th></th></tr></thead><tbody>${rows}</tbody>`));
  s.appendChild(p);
}

// ---------- TEAM MATCHES ----------
function renderTeams(){
  const s=$('#teams'); s.innerHTML='';
  // wins tally
  const tw=el('div','panel'); tw.appendChild(el('h2','sec','Team match wins by player'));
  const order=[...CODES].sort((a,b)=>DATA.team_wins[b]-DATA.team_wins[a]);
  const g=el('div','selrow');
  order.forEach(c=>{const b=el('button');b.style.cursor='default';
    b.innerHTML=`<span class="dot" style="background:${PC[c]};display:inline-block;margin-right:6px"></span>${NAME[c]} — <b>${DATA.team_wins[c]}</b>`;g.appendChild(b);});
  tw.appendChild(g);
  tw.appendChild(el('div','note','A player is credited a win for every 9-hole match their team won. Match 6 was a tie (no winner).'));
  s.appendChild(tw);
  // match cards
  const p=el('div','panel'); p.appendChild(el('h2','sec','The 7 matches'));
  DATA.team_results.forEach(t=>{
    const c=el('div','mcard');
    const w2=t.winner==='two', w3=t.winner==='three';
    c.innerHTML=`<div class="lab">Match ${t.m} · ${t.label} · ${t.day}</div>
      <div class="teamrow ${w2?'win':''}"><span class="nm">${t.twoNames.join(' & ')} <small style="color:var(--muted)">(2-man)</small></span><span class="sc">${t.s2}</span></div>
      <div class="teamrow ${w3?'win':''}"><span class="nm">${t.threeNames.join(' / ')} <small style="color:var(--muted)">(3-man)</small></span><span class="sc">${t.s3}</span></div>
      ${t.winner==='tie'?'<span class="badge tie">Tied — '+t.s2+' apiece</span>'
        :'<span class="badge">'+ (w2?t.twoNames.join(' & '):t.threeNames.join(' / ')) +' win by '+t.margin+'</span>'}`;
    p.appendChild(c);
  });
  s.appendChild(p);
}

// ---------- SCORECARDS (by match) ----------
let scMode='net';
function renderMatches(){
  const s=$('#matches'); s.innerHTML='';
  const p=el('div','panel');
  p.appendChild(el('h2','sec','Scorecard explorer — pick a match'));
  const sel=el('div','selrow');
  DATA.matches.forEach(m=>{const b=el('button',m.m===curMatch?'active':'');b.textContent='M'+m.m;
    b.onclick=()=>{curMatch=m.m;renderMatches();};sel.appendChild(b);});
  p.appendChild(sel);
  // toggle
  const tg=el('div','toggle');
  [['net','Net'],['gross','Gross'],['pts','Stableford']].forEach(([k,lab])=>{
    const b=el('button',scMode===k?'active':'');b.textContent=lab;b.onclick=()=>{scMode=k;renderMatches();};tg.appendChild(b);});
  p.appendChild(tg);
  p.appendChild(buildScorecard(curMatch));
  // legend
  if(scMode!=='pts'){
    p.appendChild(el('div','legend',
      `<span><i style="background:var(--eagle)"></i>eagle+</span><span><i style="background:var(--birdie)"></i>birdie</span>
       <span><i style="background:var(--par)"></i>par</span><span><i style="background:var(--bogey)"></i>bogey</span>
       <span><i style="background:var(--double)"></i>dbl+</span><span><span class="bonusdot">◆</span> bonus hole</span>`));
  } else {
    p.appendChild(el('div','note','Stableford points shown (net). ◆ marks the double-points bonus hole for this nine — points there are already doubled.'));
  }
  // team + individual result for this match
  const tr=DATA.team_results.find(x=>x.m===curMatch);
  const nineStbl=[...CODES].sort((a,b)=>DATA.stbl_match[curMatch][b]-DATA.stbl_match[curMatch][a]);
  const res=el('div','panel');res.style.marginTop='14px';
  res.appendChild(el('h2','sec','This nine — results'));
  res.appendChild(el('div',null,
    `<div style="font-size:14px;margin-bottom:6px"><b>Team match:</b> ${tr.twoNames.join(' & ')} ${tr.s2} vs ${tr.threeNames.join(' / ')} ${tr.s3} — `+
    (tr.winner==='tie'?'<b>tied</b>':'<b style="color:var(--accent)">'+(tr.winner==='two'?tr.twoNames.join(' & '):tr.threeNames.join(' / '))+' by '+tr.margin+'</b>')+'</div>'+
    `<div style="font-size:14px"><b>Stableford (this nine):</b> `+nineStbl.map((c,i)=>`${i==0?'🥇 ':''}${NAME[c]} ${DATA.stbl_match[curMatch][c]}`).join(' · ')+`</div>`));
  s.appendChild(p); s.appendChild(res);
}
function buildScorecard(m){
  const wrap=el('div','scwrap');
  const holes=[1,2,3,4,5,6,7,8,9];
  const bonusDbl=DATA.matches.find(x=>x.m===m).bonus.dbl;
  let head=`<tr class="parrow"><th class="pl">Hole</th>`+holes.map(h=>`<th>${h}${h===bonusDbl&&scMode==='pts'?' <span class="bonusdot">◆</span>':''}</th>`).join('')+`<th>Tot</th></tr>`;
  const co=DATA.course;
  head+=`<tr class="parrow"><th class="pl">Par</th>`+holes.map(h=>`<th>${co[m+'_'+h].par}</th>`).join('')+`<th></th></tr>`;
  head+=`<tr class="parrow"><th class="pl">SI</th>`+holes.map(h=>`<th style="color:var(--muted);font-weight:400">${co[m+'_'+h].si}</th>`).join('')+`<th></th></tr>`;
  let body='';
  const order=[...CODES].sort((a,b)=>DATA.stbl_match[m][b]-DATA.stbl_match[m][a]);
  order.forEach(c=>{
    const card=DATA.scorecard[m][c];
    let tot=0;
    const cells=card.map(x=>{
      if(scMode==='pts'){tot+=x.pts;return `<td>${x.pts}</td>`;}
      const val=scMode==='net'?x.net:x.gross;
      const catk=scMode==='net'?x.ncat:x.gcat;
      tot+=val;
      return `<td><span class="cell c-${catk}">${val}</span></td>`;
    }).join('');
    body+=`<tr><td class="pl"><span class="dot" style="background:${PC[c]};display:inline-block;margin-right:6px"></span>${NAME[c]}</td>${cells}<td class="tot">${tot}</td></tr>`;
  });
  wrap.appendChild(el('table','sc',`<thead>${head}</thead><tbody>${body}</tbody>`));
  return wrap;
}

// ---------- PLAYER CARDS ----------
function renderPlayers(){
  const s=$('#players'); s.innerHTML='';
  const p=el('div','panel');
  p.appendChild(el('h2','sec','Player cards — pick a player'));
  const sel=el('div','selrow');
  CODES.forEach(c=>{const b=el('button',c===curPlayer?'active':'');
    b.innerHTML=`<span class="dot" style="background:${PC[c]};display:inline-block;margin-right:6px"></span>${NAME[c]}`;
    if(c===curPlayer)b.style.background=PC[c],b.style.borderColor=PC[c];
    b.onclick=()=>{curPlayer=c;renderPlayers();};sel.appendChild(b);});
  p.appendChild(sel);
  const c=curPlayer;
  const rank=[...CODES].sort((a,b)=>DATA.overall[b]-DATA.overall[a]).indexOf(c)+1;
  const bh=DATA.best_hole[c], wh=DATA.worst_hole[c];
  const fmt=d=>d<=-2?'eagle':d===-1?'birdie':d===0?'par':d===1?'bogey':(d>=2?'+'+d:d);
  const kpis=el('div','kpis');
  [['Stableford',DATA.overall[c]],['Rank','#'+rank+' of 5'],['Team wins',DATA.team_wins[c]],
   ['Gross total',DATA.gross_total[c]],['Net total',DATA.net_total[c]],['Handicap',HC[c]]]
   .forEach(([k,v])=>{const st=el('div','stat');st.innerHTML=`<div class="lab">${k}</div><div class="val">${v}</div>`;kpis.appendChild(st);});
  p.appendChild(kpis);
  // best/worst hole
  const bw=el('div','grid');
  bw.appendChild(mk('Best hole of the weekend',
    `net ${fmt(bh.nd)} `,`${bh.label} · hole ${bh.h} (par ${bh.par}) — gross ${bh.gross}, net ${bh.net}`));
  bw.appendChild(mk('Roughest hole',
    `net ${fmt(wh.nd)} `,`${wh.label} · hole ${wh.h} (par ${wh.par}) — gross ${wh.gross}, net ${wh.net}`));
  p.appendChild(bw);
  // category bars (net)
  const catP=el('div','panel');catP.style.marginTop='14px';
  catP.appendChild(el('h2','sec',NAME[c]+' — hole results (net vs gross)'));
  const cats=[['eagle','Eagle+','#0b7d5b'],['birdie','Birdie','#4fae7d'],
    ['par','Par','#8aa08a'],['bogey','Bogey','#e2915f'],['double','Dbl+','#d9694a']];
  // scale bars to this player's max count so the biggest bar nearly fills the track
  let pmax=1;
  cats.forEach(([k])=>{pmax=Math.max(pmax,DATA.catcount[c].net[k],DATA.catcount[c].gross[k]);});
  catP.appendChild(el('div','note','Net results (top) vs gross (bottom). Bars scaled to this player’s most-frequent result.'));
  const cb=el('div','catbars');
  cats.forEach(([k,lab,col])=>{
    const nn=DATA.catcount[c].net[k];const w1=Math.round(nn/pmax*100);
    cb.appendChild(el('div','catbar',
      `<span class="k">${lab}</span>
       <span class="track"><span class="fill" style="width:${w1}%;background:${col}"></span></span><span class="n">${nn}</span>
       <span style="width:40px;text-align:right;color:var(--muted);font-size:11px">net</span>`));
  });
  catP.appendChild(cb);
  // gross row
  const cbg=el('div','catbars');cbg.style.marginTop='10px';
  cats.forEach(([k,lab,col])=>{
    const ng=DATA.catcount[c].gross[k];const w2=Math.round(ng/pmax*100);
    cbg.appendChild(el('div','catbar',
      `<span class="k">${lab}</span>
       <span class="track"><span class="fill" style="width:${w2}%;background:${col};opacity:.6"></span></span><span class="n">${ng}</span>
       <span style="width:40px;text-align:right;color:var(--muted);font-size:11px">gross</span>`));
  });
  catP.appendChild(cbg);
  p.appendChild(catP);
  // per-nine stableford
  const npP=el('div','panel');npP.style.marginTop='14px';
  npP.appendChild(el('h2','sec','Stableford by nine'));
  const nb=el('div','ninebars');
  const vals=[];for(let m=1;m<=7;m++)vals.push(DATA.stbl_match[m][c]);
  const mxv=Math.max(...vals);
  for(let m=1;m<=7;m++){const v=DATA.stbl_match[m][c];
    const b=el('div','b');b.innerHTML=`<span class="v">${v}</span><div class="bar2" style="height:${Math.round(v/mxv*70)}px;background:${PC[c]}"></div><span class="cap">M${m}</span>`;nb.appendChild(b);}
  npP.appendChild(nb);
  p.appendChild(npP);
  s.appendChild(p);
  function mk(lab,big,sub){const d=el('div','stat');d.innerHTML=`<div class="lab">${lab}</div><div class="val">${big}</div><div class="who2">${sub}</div>`;return d;}
}

// ---------- RECORDS ----------
function renderRecords(){
  const s=$('#records'); s.innerHTML='';
  const p=el('div','panel'); p.appendChild(el('h2','sec','Weekend records & fun stats'));
  const g=el('div','grid');
  const R=DATA.records;
  const card=(lab,val,who)=>{const d=el('div','stat');d.innerHTML=`<div class="lab">${lab}</div><div class="val">${val}</div><div class="who2">${who}</div>`;return d;};
  g.appendChild(card('Most net birdies',R.net_birdies[1],R.net_birdies[0].join(', ')));
  g.appendChild(card('Most net eagles',R.net_eagles[1],R.net_eagles[0].join(', ')||'—'));
  g.appendChild(card('Most net pars',R.net_pars[1],R.net_pars[0].join(', ')));
  g.appendChild(card('Most gross birdies',R.gross_birdies[1],R.gross_birdies[0].join(', ')));
  g.appendChild(card('Most gross pars',R.gross_pars[1],R.gross_pars[0].join(', ')));
  g.appendChild(card('Lowest gross nine',DATA.low_gross_nine.val,DATA.low_gross_nine.name+' · '+DATA.low_gross_nine.label));
  g.appendChild(card('Best Stableford nine',DATA.best_stbl_nine.val,DATA.best_stbl_nine.name+' · '+DATA.best_stbl_nine.label));
  // biggest team blowout & closest
  let big=DATA.team_results.filter(t=>t.winner!=='tie').reduce((a,b)=>b.margin>a.margin?b:a);
  let close=DATA.team_results.filter(t=>t.winner!=='tie').reduce((a,b)=>b.margin<a.margin?b:a);
  const wn=t=>t.winner==='two'?t.twoNames.join(' & '):t.threeNames.join(' / ');
  g.appendChild(card('Biggest team win','+'+big.margin,wn(big)+' · '+big.label));
  g.appendChild(card('Closest team match','+'+close.margin,wn(close)+' · '+close.label));
  p.appendChild(g);
  s.appendChild(p);
}

let curMatch=1, curPlayer='C';
renderStandings();renderTeams();renderMatches();renderPlayers();renderRecords();
</script>
